name: Build patched image

# This file lives here as a template; fork-branch.sh copies it into the GitHub
# fork as .github/workflows/build-image.yml. It does not run in this repo.
#
# It builds the branch fork-branch.sh publishes — the upstream tag plus our
# patches — and pushes the runtime image to the Gitea registry the deploy host
# pulls from. The source branch is an input, so the fork's default branch can
# stay a plain mirror of upstream and still show the "Run workflow" button.
#
# Deliberate differences from build.sh: 03-docker-mirror.patch is not applied
# (its China mirrors only add latency to a runner outside China) and the
# runtime image is built with BASE_REGISTRY empty, i.e. plain docker.io.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch holding the patched source
        required: true
        default: deploy/rc.41
      image_tag:
        description: Tag to publish (also embedded as the build version)
        required: true
        default: v1.0.0-rc.41
      image:
        description: Registry path of the published image
        required: true
        default: 106.53.27.77:3000/bloodarea/new-api
      push:
        description: Push the image to the Gitea registry
        type: boolean
        default: true

env:
  REGISTRY: 106.53.27.77:3000
  # Toolchains the local build was verified with.
  GO_VERSION: 1.26.1
  BUN_VERSION: 1.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the patched source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Verify this is the patched source tree
        run: |
          test -f go.mod && test -f main.go \
            || { echo "::error::${{ inputs.source_ref }} is not a new-api source tree"; exit 1; }
          test -f deploy/Dockerfile \
            || { echo "::error::deploy/Dockerfile is missing on ${{ inputs.source_ref }}"; exit 1; }
          grep -q fetch_icon controller/channel.go \
            || { echo "::error::the patches are not applied on ${{ inputs.source_ref }}"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build frontend
        working-directory: web
        env:
          DISABLE_ESLINT_PLUGIN: "true"
          VITE_REACT_APP_VERSION: ${{ inputs.image_tag }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p runtime/licenses
          go build \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=${{ inputs.image_tag }}'" \
            -o "$GITHUB_WORKSPACE/runtime/new-api" .
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md runtime/licenses/

      - name: Build runtime image
        run: |
          docker build \
            --build-arg BASE_REGISTRY= \
            -t "${{ inputs.image }}:${{ inputs.image_tag }}" \
            -t "${{ inputs.image }}:latest" \
            -f deploy/Dockerfile runtime
          docker image inspect "${{ inputs.image }}:${{ inputs.image_tag }}" \
            --format 'image {{.Id}} {{.Size}} bytes'

      # The registry speaks plain HTTP on :3000, so the daemon has to allow it.
      - name: Allow the plain-HTTP registry
        if: inputs.push
        run: |
          echo '{"insecure-registries":["106.53.27.77:3000"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      - name: Push to the Gitea registry
        if: inputs.push
        env:
          GITEA_USER: ${{ secrets.GITEA_USER }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          echo "$GITEA_TOKEN" | docker login "$REGISTRY" -u "$GITEA_USER" --password-stdin
          docker push "${{ inputs.image }}:${{ inputs.image_tag }}"
          docker push "${{ inputs.image }}:latest"

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: new-api-${{ inputs.image_tag }}
          path: runtime/new-api
          retention-days: 14
