# Deploy stack for new-api, built locally from upstream + patches/.
# Secrets come from ../.env (see .env.example); nothing sensitive lives here.
#
# PREREQUISITE: the image below is NOT pulled from a registry and there is no
# `build:` section. It must already exist on this host, produced by ../build.sh
# (or loaded from `docker save`). `docker compose up` on a host without it fails
# with "pull access denied for new-api-local". See README_ZH.md.

services:
  new-api:
    # Prebuilt by ../build.sh. Not on Docker Hub — nothing to pull.
    image: new-api-local:local
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
      - STREAMING_TIMEOUT=300
      # Upstream calls go through the host's HTTP proxy. Change these to match
      # your host, or drop them entirely on a machine with direct internet.
      - HTTP_PROXY=${HTTP_PROXY_URL:-http://host.docker.internal:7890}
      - HTTPS_PROXY=${HTTP_PROXY_URL:-http://host.docker.internal:7890}
      - http_proxy=${HTTP_PROXY_URL:-http://host.docker.internal:7890}
      - https_proxy=${HTTP_PROXY_URL:-http://host.docker.internal:7890}
      - NO_PROXY=localhost,127.0.0.1,::1,postgres,redis,new-api,host.docker.internal
      - no_proxy=localhost,127.0.0.1,::1,postgres,redis,new-api,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: new-api-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: new-api-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network

volumes:
  pg_data:

networks:
  new-api-network:
    driver: bridge
