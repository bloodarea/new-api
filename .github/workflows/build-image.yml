name: Build patched image

# Same recipe as build.sh, but runs on a GitHub-hosted runner so the build
# machine needs no Go/Bun/Docker. Two deliberate differences:
#
#   * 03-docker-mirror.patch is skipped. It points the base images and the
#     package managers at China mirrors; the runner's egress is outside China,
#     where those mirrors only add latency.
#   * The runtime image is built with an empty BASE_REGISTRY, i.e. plain
#     docker.io, for the same reason.
#
# The image is pushed to the Gitea registry the deploy host pulls from.

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream new-api tag to build
        required: true
        default: v1.0.0-rc.41
      image_tag:
        description: Tag to publish (also written into VERSION)
        required: true
        default: v1.0.0-rc.41
      image:
        description: Registry path of the published image
        required: true
        default: 106.53.27.77:3000/bloodarea/new-api
      push:
        description: Push the image to the Gitea registry
        type: boolean
        default: true

env:
  REGISTRY: 106.53.27.77:3000
  # Toolchains the local build was verified with.
  GO_VERSION: 1.26.1
  BUN_VERSION: 1.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out upstream at the tracked tag
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          git clone --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/QuantumNous/new-api.git src
          git -C src log -1 --format='upstream %H (%s)'

      - name: Apply patches
        env:
          VERSION: ${{ inputs.image_tag }}
        run: |
          cd src
          for p in ../patches/0[12]-*.patch; do
            git apply "$p"
            echo "applied $(basename "$p")"
          done
          echo "$VERSION" > VERSION

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build frontend
        working-directory: src/web
        env:
          DISABLE_ESLINT_PLUGIN: "true"
          VITE_REACT_APP_VERSION: ${{ inputs.image_tag }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build backend
        working-directory: src
        env:
          VERSION: ${{ inputs.image_tag }}
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p "$GITHUB_WORKSPACE/runtime/licenses"
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=${VERSION}'" \
            -o "$GITHUB_WORKSPACE/runtime/new-api" .
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$GITHUB_WORKSPACE/runtime/licenses/"

      - name: Build runtime image
        env:
          VERSION: ${{ inputs.image_tag }}
          IMAGE: ${{ inputs.image }}
        run: |
          docker build \
            --build-arg BASE_REGISTRY= \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            -f deploy/Dockerfile runtime
          docker image inspect "$IMAGE:$VERSION" --format 'image {{.Id}} {{.Size}} bytes'

      # The registry speaks plain HTTP on :3000, so the daemon has to allow it.
      - name: Allow the plain-HTTP registry
        if: inputs.push
        run: |
          echo '{"insecure-registries":["106.53.27.77:3000"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      - name: Push to the Gitea registry
        if: inputs.push
        env:
          VERSION: ${{ inputs.image_tag }}
          IMAGE: ${{ inputs.image }}
          GITEA_USER: ${{ secrets.GITEA_USER }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          echo "$GITEA_TOKEN" | docker login "$REGISTRY" -u "$GITEA_USER" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: new-api-${{ inputs.image_tag }}
          path: runtime/new-api
          retention-days: 14
